name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Key guard (only the endpoint templates are tracked)
        run: |
          want=$'sys_config/embedder_api/default_to_complete.yaml\nsys_config/llm_api/default_to_complete.yaml'
          got="$(git ls-files sys_config/llm_api sys_config/embedder_api | sort)"
          if [ "$got" != "$want" ]; then
            echo "Endpoint files hold API keys; only the templates may be tracked. Tracked:"
            echo "$got"
            exit 1
          fi
          if grep -qE '^\s*api_key:\s*\S' sys_config/llm_api/default_to_complete.yaml sys_config/embedder_api/default_to_complete.yaml; then
            echo "A template has a value for api_key."
            exit 1
          fi
      - run: python -m pip install -U pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pre_commit run --all-files --show-diff-on-failure

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (all commits)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Placeholder endpoint files (template copies; system.main needs the primary and embedder files, and the fakes replace each backend that has one)
        run: |
          for f in default gpt-4o gpt-5 gpt-5-high deepseek llama; do
            cp sys_config/llm_api/default_to_complete.yaml "sys_config/llm_api/$f.yaml"
          done
          cp sys_config/embedder_api/default_to_complete.yaml sys_config/embedder_api/default.yaml
      - name: Tests, including golden and end-to-end (fake models; no API calls)
        run: python -m pytest -q -m "not integration and not sandbox"
      - name: Experiment scripts (dry run)
        run: |
          for s in scripts/experiments/[0-9]*/*.sh; do
            DRY_RUN=1 bash "$s" > /dev/null || { echo "DRY_RUN failed: $s"; exit 1; }
          done
