[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers --strict-config
markers =
    integration: requires live external services (LLM API, arXiv API)
    sandbox: requires running sandbox server
    slow: long-running local test that does not require external services

filterwarnings =
    # SWIG-generated types warning (often from faiss / similar SWIG bindings)
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning

    # langchain_community arxiv wrapper deprecation (only from that module)
    ignore:The 'Search\.results' method is deprecated, use 'Client\.results' instead:DeprecationWarning:langchain_community\.utilities\.arxiv
